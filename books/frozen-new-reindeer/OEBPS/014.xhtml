    <p>
      <span class="font-11">
        <span id="w376">Outside,</span>
        <span id="w377">Elsa</span>
        <span id="w378">looked</span>
        <span id="w379">at</span>
        <span id="w380">Anna.</span>
        <span id="w381">&#8220;That</span>
        <br/>
        <span id="w382">wasn&#8217;t</span>
        <span id="w383">special.</span>
        <span id="w384">We</span>
        <span id="w385">already</span>
        <span id="w386">did</span>
        <span id="w387">the</span>
        <span id="w388">winter</span>
        <br/>
        <span id="w389">in</span>
        <span id="w390">summer</span>
        <span id="w391">thing,</span>
        <span id="w392">remember?&#8221;</span>
      </span>
    </p>
    <p>
      <span class="font-11">
        <span id="w393">Anna</span>
        <span id="w394">grinned.</span>
        <span id="w395">&#8220;Of</span>
        <span id="w396">course,</span>
        <span id="w397">but</span>
        <span id="w398">he</span>
        <span id="w399">was</span>
        <br/>
        <span id="w400">so</span>
        <span id="w401">nice,</span>
        <span id="w402">how</span>
        <span id="w403">could</span>
        <span id="w404">I</span>
        <span id="w405">say</span>
        <span id="w406">no?&#8221;</span>
      </span>
    </p>
    <p>
      <span class="font-11">
        <span id="w407">Elsa</span>
        <span id="w408">had</span>
        <span id="w409">to</span>
        <span id="w410">laugh.</span>
      </span>
    </p>
    <p>
      <span class="font-11">
        <span id="w411">As</span>
        <span id="w412">they</span>
        <span id="w413">set</span>
        <span id="w414">out</span>
        <span id="w415">again,</span>
        <span id="w416">Olaf</span>
        <span id="w417">ran</span>
        <span id="w418">ahead,</span>
        <span id="w419">shouting,</span>
      </span>
      <br/>
      <span class="font-12">
        <span id="w420">&#8220;This</span>
        <span id="w421">is</span>
        <span id="w422">the</span>
        <span id="w423">best</span>
        <span id="w424">day</span>
        <span id="w425">of</span>
        <span id="w426">my</span>
        <span id="w427">life!&#8221;</span>
      </span>
    </p>
