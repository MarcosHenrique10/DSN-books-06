    <p>
      <span class="font-3">
        <span id="w215">&#8220;Reindeer!&#8221;</span>
        <span id="w216">said</span>
        <span id="w217">Anna,</span>
        <span id="w218">when</span>
        <span id="w219">they</span>
        <span id="w220">came</span>
        <span id="w221">upon</span>
        <span id="w222">their</span>
        <span id="w223">new</span>
        <span id="w224">friend.</span>
        <br/>
        <span id="w225">&#8220;Kristoff</span>
        <span id="w226">said</span>
        <span id="w227">he</span>
        <span id="w228">could</span>
        <span id="w229">organize</span>
        <span id="w230">rides,</span>
        <span id="w231">at</span>
        <span id="w232">least</span>
        <span id="w233">on</span>
        <span id="w234">Sven.&#8221;</span>
      </span>
    </p>
    <p style="padding-top: .2em;">
      <span class="font-7" style="color:#25408F;">
        <span id="w235">&#8220;Little</span>
        <span id="w236">Sven</span>
        <span id="w237">can</span>
        <span id="w238">ride</span>
        <span id="w239">on</span>
        <span id="w240">my</span>
        <span id="w241">back,&#8221;</span>
        <span id="w242">said</span>
        <span id="w243">Olaf.</span>
      </span>
    </p>
    <p class="no-indent" style="margin-top: -.25em;">
      <span class="font-3">
        <span id="w244">&#8220;Nothing&#8217;s</span>
        <span id="w245">stronger</span>
        <span id="w246">than</span>
        <span id="w247">snow!&#8221;</span>
      </span>
    </p>
    <p>
      <span class="font-3">
        <span id="w248">&#8220;We&#8217;ll</span>
        <span id="w249">need</span>
        <span id="w250">mounds</span>
        <span id="w251">of</span>
        <span id="w252">carrots,&#8221;</span>
        <span id="w253">said</span>
        <span id="w254">Elsa.</span>
      </span>
    </p>
