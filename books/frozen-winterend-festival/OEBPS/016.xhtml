    <p>
      <span class="font-3">
        <span id="w480">Anna</span>
        <span id="w481">found</span>
        <span id="w482">an</span>
        <span id="w483">unlocked</span>
        <span id="w486">door.</span>
      </span>
      <span class="font-7" style="color:#25408F;">
        <span id="w487">&#8220;Ice</span>
        <span id="w488">sculpting?&#8221;</span>
      </span>
      <span class="font-3">
        <span id="w489">she</span>
        <span id="w490">asked.</span>
      </span>
    </p>
    <p class="no-indent" style="margin-top: -.2em;">
      <span class="font-3">
        <span id="w491">&#8220;That&#8217;s</span>
        <span id="w492">brilliant,</span>
        <span id="w493">but</span>
        <span id="w494">you</span>
        <span id="w495">can&#8217;t</span>
        <span id="w496">compete.</span>
        <span id="w497">It</span>
        <span id="w498">wouldn&#8217;t</span>
        <span id="w499">be</span>
        <span id="w500">fair.&#8221;</span>
      </span>
    </p>
    <p>
      <span class="font-3">
        <span id="w501">Elsa</span>
        <span id="w502">smiled.</span>
        <span id="w503">&#8220;Don&#8217;t</span>
        <span id="w504">worry.</span>
        <span id="w505">I&#8217;m</span>
        <span id="w506">just</span>
        <span id="w507">doing</span>
        <span id="w508">this</span>
        <span id="w509">for</span>
        <span id="w510">decoration.</span>
        <br/>
        <span id="w511">But</span>
        <span id="w512">your</span>
        <span id="w513">krumkake</span>
        <span id="w514">has</span>
        <span id="w515">given</span>
        <span id="w516">me</span>
        <span id="w517">an</span>
        <span id="w518">idea.&#8221;</span>
      </span>
    </p>
    <p>
      <span class="font-3">
        <span id="w519">&#8220;To</span>
        <span id="w520">serve</span>
        <span id="w521">hot</span>
        <span id="w522">chocolate</span>
        <span id="w523">or</span>
        <span id="w524">hot</span>
        <span id="w525">apple</span>
        <span id="w526">cider</span>
        <span id="w527">or</span>
        <span id="w528">both?&#8221;</span>
        <br/>
        <span id="w529">Anna</span>
        <span id="w530">asked.</span>
      </span>
    </p>
