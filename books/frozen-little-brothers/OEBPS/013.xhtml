<img src="images/013.jpg" alt="&#x201C;Come on guys, let&#x2019;s play!&#x201D;" class="image"/>
<div class="page13_item1">
<p class="indent"><span class="big1"><span id="w200">&#x201C;Come</span> 
<span id="w201">on</span> 
<span id="w202">guys,</span> 
<span id="w203">let&#x2019;s</span> 
<span id="w204">play!&#x201D;</span></span> 
<span id="w205">Olaf</span> 
<span id="w206">continued.</span></p>
<p class="indent"><span id="w207">As</span> 
<span id="w208">he</span> 
<span id="w209">tried</span> 
<span id="w210">to</span> 
<span id="w211">gather</span> 
<span id="w212">some</span> 
<span id="w213">of</span> 
<span id="w214">the</span> 
<span id="w215">snowgies</span> 
<span id="w216">into</span> 
<span id="w217">a</span> 
<span id="w218">group,</span> 
<span id="w219">he<br/></span> 
<span id="w220">slipped</span> 
<span id="w221">and</span> 
<span id="w222">landed</span> 
<span id="w223">on</span> 
<span id="w224">his</span> 
<span id="w225">back.</span> 
<span id="w226">&#x201C;Whoa!</span> 
<span id="w227">The</span> 
<span id="w228">floor&#x2019;s</span> 
<span id="w229">all</span> 
<span id="w230">slippery.<br/></span> 
<span id="w231">Slippery?</span> 
<span id="w232">Hey,</span> 
<span id="w233">that</span> 
<span id="w234">means&#x2014;</span><span id="w235">we</span> 
<span id="w236">can</span> 
<span id="w237"><span class="italic">skate</span>!</span> 
<span id="w238">I</span> 
<span id="w239">just</span> 
<span id="w240">love</span> 
<span id="w241">skating!&#x201D;</span></p>
<p class="indent"><span id="w242">Olaf</span> 
<span id="w243">got</span> 
<span id="w244">to</span> 
<span id="w245">his</span> 
<span id="w246">feet</span> 
<span id="w247">and</span> 
<span id="w248">twirled</span> 
<span id="w249">around.</span></p>
